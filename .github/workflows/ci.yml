name: CI

on:
  push:
      branches:
            - main
                  - develop
                        - 'feature/**'
                              - 'feature-*'
                                pull_request:
                                    branches:
                                          - main
                                            workflow_dispatch:

                                            jobs:
                                              test:
                                                  runs-on: ubuntu-latest

                                                      steps:
                                                            - name: Checkout do código
                                                                    uses: actions/checkout@v4

                                                                          - name: Configurar Python
                                                                                  uses: actions/setup-python@v5
                                                                                          with:
                                                                                                    python-version: '3.11'
                                                                                                    
                                                                                                          - name: Instalar dependências
                                                                                                                  run: |
                                                                                                                            python -m pip install --upgrade pip
                                                                                                                                      pip install -r requirements.txt
                                                                                                                                      
                                                                                                                                            - name: Executar testes
                                                                                                                                                    run: PYTHONPATH=. pytest -v
                                                                                                                                                    
                                                                                                                                                          - name: Discord Notification
                                                                                                                                                                  if: always()
                                                                                                                                                                          uses: tsickert/discord-webhook@v6.0.0
                                                                                                                                                                                  with:
                                                                                                                                                                                            webhook-url: "https://discord.com/api/webhooks/1498484593345564792/kOjHTq70UCQkV0Z8pl6L6Bl4CM-gwMzmc3msGEannm8Dv9xjSWlSulrTNkvAaAWI_aP9"
                                                                                                                                                                                                      content: "🚀 **CI Pipeline** no repositório **${{ github.repository }}**\n🔹 **Evento:** ${{ github.event_name }}\n🔹 **Status:** ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }}\n🔗 [Ver detalhes](https://github.com/${{ github.
