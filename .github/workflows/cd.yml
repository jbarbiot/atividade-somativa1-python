name: CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feature-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orientacao-somativa1:latest

      - name: Discord Notification
        if: always()
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: "https://discord.com/api/webhooks/1498484593345564792/kOjHTq70UCQkV0Z8pl6L6Bl4CM-gwMzmc3msGEannm8Dv9xjSWlSulrTNkvAaAWI_aP9"
          content: "🐳 **CD Pipeline (Docker Build)** no repositório **${{ github.repository }}**\n🔹 **Evento:** ${{ github.event_name }}\n🔹 **Status:** ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }}\n🔗 [Ver detalhes](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
